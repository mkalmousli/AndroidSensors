[project]
name = "androidsensors"
version = "0.1.0"
description = "Patch AOSP so sensors are real system HALs exposed as a GraphQL API"
requires-python = ">=3.11"
dependencies = ["jinja2>=3.1", "pyyaml>=6.0"]

[project.scripts]
asp = "asp.cli:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/asp"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]
